<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <table id="library-table">
        <caption>Library 📖</caption>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Pages</th>
                <th>Read</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
        </tbody>
    </table>

    <button class="new-book-btn" command="show-modal" commandfor="new-book-dialog">+</button>

    <dialog id="new-book-dialog">
        <h1>Add a new book</h1>

        <form>
            <div class="input-group">
                <label for="title">Title: </label>
                <input type="text" name="title" id="title" required>
            </div>

            <div class="input-group">
                <label for="author">Author: </label>
                <input type="text" name="author" id="author" required>
            </div>

            <div class="input-group">
                <label for="pages">Pages: </label>
                <input type="number" name="pages" id="pages" min="1" value="1" required>
            </div>

            <div class="checkbox-group">
                <label for="read">Read: </label>
                <input type="checkbox" name="read" id="read">
            </div>

            <div class="button-group">
                <button type="button" command="close" commandfor="new-book-dialog">Close</button>

                <button type="submit">Add</button>
            </div>
        </form>

    </dialog>
</body>

</html>
